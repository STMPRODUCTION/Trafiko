behaviors:
  TrafficLightBrain:
    trainer_type: ppo
    hyperparameters:
      learning_rate: 3.0e-4
      batch_size: 128
      buffer_size: 2048
    network_settings:
      hidden_units: 256
      num_layers: 4
      actor_critic:
        actor:
          num_layers: 2
        critic:
          num_layers: 2
    reward_signals:
      extrinsic:
        strength: 1.0
        gamma: 0.99
    max_steps: 800000
    checkpoint_interval: 15000
    summary_freq: 200